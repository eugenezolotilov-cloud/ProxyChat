<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProxyChat</title>
    
    <!-- PWA Settings (Строгие физические файлы для Android WebAPK и Apple) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ProxyChat">
    
    <!-- Fallback для Apple (нужен физический PNG файл) -->
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Favicon для вкладок браузера (Оставляем Data URI, чтобы моментально грузился вектор) -->
    <script>
        const proxySvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="line-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="line-white" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a1a1aa" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#09090b"/>
  <g filter="url(#node-shadow)">
    <circle cx="256" cy="256" r="175" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2.5" stroke-dasharray="10 10"/>
    <path d="M 90 256 C 160 256, 175 150, 256 150" fill="none" stroke="url(#line-blue)" stroke-width="11" stroke-linecap="round"/>
    <path d="M 422 256 C 352 256, 337 362, 256 362" fill="none" stroke="url(#line-white)" stroke-width="11" stroke-linecap="round"/>
    <rect x="201" y="201" width="110" height="110" rx="32" transform="rotate(45 256 256)" fill="#18181b" stroke="#ffffff" stroke-width="4" stroke-opacity="0.85"/>
    <circle cx="256" cy="256" r="22" fill="#3b82f6"/>
    <circle cx="256" cy="256" r="9" fill="#ffffff"/>
  </g>
</svg>`;
        const iconDataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(proxySvg);
        document.head.insertAdjacentHTML('beforeend', `<link rel="icon" type="image/svg+xml" href="${iconDataUrl}">`);
    </script>

    <!-- Tailwind CSS -->
    <script>
        window.tailwind = {
            theme: {
                extend: {
                    colors: { bgbase: '#09090b', panel: '#18181b' },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Marked (Markdown) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        /* Typography & Base Variables */
        body { background-color: #09090b; color: #f4f4f5; font-family: ui-sans-serif, system-ui, sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        /* Premium Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
        
        /* Monotonic Liquid Glass Effects (Dark) */
        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .glass-input {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* -----------------------------------------------------------------
           СВЕТЛАЯ ТЕМА (LIGHT FROSTED Glass) 
           ----------------------------------------------------------------- */
        body.light-theme {
            background-color: #f4f4f5;
            color: #18181b;
        }
        
        body.light-theme ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); }
        body.light-theme ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.3); }

        body.light-theme .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }
        
        body.light-theme .glass-input {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.15);
            color: #18181b;
        }

        body.light-theme textarea::placeholder, 
        body.light-theme input::placeholder {
            color: #71717a !important;
        }
        
        body.light-theme .text-white { color: #18181b !important; }
        body.light-theme .text-zinc-200, body.light-theme .text-zinc-300 { color: #3f3f46 !important; }
        body.light-theme .text-zinc-400 { color: #52525b !important; }
        body.light-theme .text-zinc-500 { color: #71717a !important; }
        
        body.light-theme .bg-bgbase { background-color: #f4f4f5 !important; }
        body.light-theme .from-bgbase { --tw-gradient-from: #f4f4f5 !important; }
        
        body.light-theme .bg-black\/40 { background-color: rgba(255, 255, 255, 0.5) !important; }
        body.light-theme .bg-black\/50 { background-color: rgba(255, 255, 255, 0.6) !important; }
        body.light-theme .bg-black\/60 { background-color: rgba(255, 255, 255, 0.7) !important; }
        body.light-theme .bg-black\/80 { background-color: rgba(255, 255, 255, 0.85) !important; }
        
        body.light-theme .border-white\/10 { border-color: rgba(0, 0, 0, 0.1) !important; }
        body.light-theme .border-white\/5 { border-color: rgba(0, 0, 0, 0.05) !important; }
        
        body.light-theme .bg-white\/5 { background-color: rgba(0, 0, 0, 0.03) !important; }
        body.light-theme .bg-white\/10 { background-color: rgba(0, 0, 0, 0.06) !important; }
        body.light-theme .hover\:bg-white\/10:hover { background-color: rgba(0, 0, 0, 0.1) !important; }
        body.light-theme .hover\:bg-white\/5:hover { background-color: rgba(0, 0, 0, 0.05) !important; }
        
        body.light-theme .bg-zinc-800 { background-color: #e4e4e7 !important; }
        body.light-theme .hover\:bg-zinc-700:hover { background-color: #d4d4d8 !important; }

        body.light-theme svg rect[fill="#09090b"] { fill: #f4f4f5 !important; }
        
        body.light-theme .border-white\/10.shadow-lg > .bg-zinc-900 {
            background-color: #18181b !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }
        body.light-theme .border-white\/10.shadow-lg > .bg-zinc-900 span,
        body.light-theme .border-white\/10.shadow-lg > .bg-zinc-900 button {
            color: #a1a1aa !important;
        }
        body.light-theme .border-white\/10.shadow-lg > .bg-\[\#0d0e12\] {
            background-color: #09090b !important;
            color: #f4f4f5 !important;
        }

        /* Micro-animations */
        .btn-icon-hover { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s; }
        .btn-icon-hover:hover svg, .btn-icon-hover:hover i { transform: scale(1.1); }
        .gear-spin:hover svg, .gear-spin:hover i { transform: rotate(90deg); }

        @keyframes trash-shake {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-15deg) scale(1.15); }
            50% { transform: rotate(10deg) scale(1.15); }
            75% { transform: rotate(-5deg) scale(1.15); }
        }
        .trash-anim { transition: all 0.2s ease-in-out; }
        .trash-anim:hover i { animation: trash-shake 0.4s ease-in-out; color: #ef4444 !important; }

        .prose pre { background: transparent !important; margin: 0 !important; padding: 0 !important; }
        .prose p { margin-top: 0.6em; margin-bottom: 0.6em; }
        .prose:first-child { margin-top: 0; }
        .prose:last-child { margin-bottom: 0; }
        .katex-display { overflow-x: auto; overflow-y: hidden; padding: 10px 0; margin: 0; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="app()" x-init="initApp()" :class="theme === 'light' ? 'light-theme' : ''" class="h-screen w-full overflow-hidden flex selection:bg-blue-500/30">

    <!-- Mobile Sidebar Overlay -->
    <div x-show="isSidebarOpen" x-transition.opacity class="md:hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-30" @click="isSidebarOpen = false" x-cloak></div>

    <!-- Парящее окно настроек -->
    <div x-show="isSettingsOpen" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div x-show="isSettingsOpen" x-transition.opacity class="absolute inset-0 bg-black/30 backdrop-blur-sm"></div>

        <div @click.away="if(apiKey) isSettingsOpen = false" 
             x-show="isSettingsOpen"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 scale-95 translate-y-8"
             x-transition:enter-end="opacity-100 scale-100 translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 scale-100 translate-y-0"
             x-transition:leave-end="opacity-0 scale-95 translate-y-8"
             class="glass bg-[#0d0e12]/80 rounded-3xl w-full max-w-md p-6 shadow-[0_0_50px_rgba(0,0,0,0.5)] transform relative z-10 border border-white/10">
            
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold flex items-center gap-2 text-white">
                    <i data-lucide="settings" class="w-5 h-5 text-blue-400 transition-transform duration-300 hover:rotate-90"></i> Настройки ProxyChat
                </h2>
                <button x-show="apiKey" @click="isSettingsOpen = false" class="text-zinc-400 hover:text-white transition btn-icon-hover p-1.5 rounded-lg hover:bg-white/5"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div class="mb-5">
                <label class="block text-xs font-semibold text-zinc-400 mb-2 uppercase tracking-wide">API Key</label>
                <div class="relative">
                    <input :type="showKey ? 'text' : 'password'" x-model="apiKey" placeholder="sk-..." class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 transition shadow-inner">
                    <button @click="showKey = !showKey" class="absolute right-3 top-3 text-zinc-400 hover:text-white transition btn-icon-hover flex items-center justify-center">
                        <span x-show="!showKey"><i data-lucide="eye" class="w-5 h-5"></i></span>
                        <span x-show="showKey" x-cloak><i data-lucide="eye-off" class="w-5 h-5"></i></span>
                    </button>
                </div>
            </div>

            <!-- Custom Base URL Override -->
            <div class="mb-5">
                <label class="block text-xs font-semibold text-zinc-400 mb-1 uppercase tracking-wide">Custom Base URL</label>
                <p class="text-[10px] text-zinc-500 mb-2">Оставьте пустым для авто-маршрутизации (OpenAI/Anthropic/Google)</p>
                <input type="text" x-model="customBaseUrl" placeholder="Например: https://api.proxyapi.ru/v1" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-zinc-600 outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 transition shadow-inner">
            </div>

            <div class="mb-8">
                <label class="block text-xs font-semibold text-zinc-400 mb-2 uppercase tracking-wide">Модель по умолчанию</label>
                <div class="relative">
                    <select x-model="currentModel" @change="saveData()" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 transition shadow-inner appearance-none cursor-pointer">
                        <template x-for="model in models" :key="model.id">
                            <option :value="model.id" x-text="model.name" class="bg-zinc-900 text-white"></option>
                        </template>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-zinc-400">
                        <i data-lucide="chevron-down" class="w-5 h-5"></i>
                    </div>
                </div>
            </div>

            <button @click="saveSettings()" class="w-full py-3.5 bg-white text-black rounded-xl font-semibold hover:bg-zinc-200 hover:scale-[1.02] active:scale-[0.98] transition-all shadow-lg">
                Сохранить и начать
            </button>
        </div>
    </div>

    <!-- Sidebar -->
    <div :class="isSidebarOpen ? 'translate-x-0 w-[298px] pl-2.5' : '-translate-x-full w-0 pl-0'" 
         class="fixed md:relative z-40 h-full py-2.5 flex flex-col transition-all duration-300 ease-in-out shrink-0 overflow-hidden">
        
        <div class="flex-1 glass rounded-3xl flex flex-col shadow-2xl w-[278px] min-w-[278px] overflow-hidden">
            <div class="p-5 flex items-center justify-between border-b border-white/5">
                <div class="flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="w-9 h-9 rounded-xl shadow-lg border border-white/10">
                      <defs>
                        <linearGradient id="line-blue-sb" x1="0%" y1="0%" x2="100%" y2="100%">
                          <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.95"/>
                          <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.35"/>
                        </linearGradient>
                        <linearGradient id="line-white-sb" x1="100%" y1="0%" x2="0%" y2="100%">
                          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
                          <stop offset="100%" stop-color="#a1a1aa" stop-opacity="0.25"/>
                        </linearGradient>
                        <filter id="node-shadow-sb" x="-20%" y="-20%" width="140%" height="140%">
                          <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.95"/>
                        </filter>
                      </defs>
                      <rect width="512" height="512" rx="112" fill="#09090b"/>
                      <g filter="url(#node-shadow-sb)">
                        <circle cx="256" cy="256" r="175" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2.5" stroke-dasharray="10 10"/>
                        <path d="M 90 256 C 160 256, 175 150, 256 150" fill="none" stroke="url(#line-blue-sb)" stroke-width="11" stroke-linecap="round"/>
                        <path d="M 422 256 C 352 256, 337 362, 256 362" fill="none" stroke="url(#line-white-sb)" stroke-width="11" stroke-linecap="round"/>
                        <rect x="201" y="201" width="110" height="110" rx="32" transform="rotate(45 256 256)" fill="#18181b" stroke="#ffffff" stroke-width="4" stroke-opacity="0.85"/>
                        <circle cx="256" cy="256" r="22" fill="#3b82f6"/>
                        <circle cx="256" cy="256" r="9" fill="#ffffff"/>
                      </g>
                    </svg>
                    <h1 class="font-bold text-lg tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white to-zinc-400">ProxyChat</h1>
                </div>
                <button @click="isSidebarOpen = false" class="text-zinc-400 hover:text-white bg-white/5 p-1.5 rounded-lg btn-icon-hover">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="px-4 mt-5 mb-2">
                <button @click="createNewChat()" class="w-full py-2.5 px-4 rounded-xl border border-white/10 hover:bg-white/10 hover:border-white/20 transition-all flex items-center justify-center gap-2 text-sm font-medium shadow-sm btn-icon-hover group">
                    <i data-lucide="plus" class="w-4 h-4 transition-transform duration-300 group-hover:rotate-90"></i> Новый диалог
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-1 mt-2">
                <template x-for="chat in chats" :key="chat.id">
                    <div @click="switchChat(chat.id)" :class="currentChatId === chat.id ? 'bg-white/5 border-white/20 shadow-[0_0_15px_rgba(255,255,255,0.07)]' : 'hover:border-white/15 hover:shadow-[0_0_15px_rgba(255,255,255,0.05)] border-transparent'" class="group relative cursor-pointer p-3 rounded-xl transition-all duration-300 flex items-center gap-3 border">
                        <i data-lucide="message-square" class="w-4 h-4 text-zinc-400"></i>
                        <div class="flex-1 truncate text-sm font-medium text-zinc-200" x-text="chat.title || 'Новый диалог'"></div>
                        
                        <button @click.stop="deleteChat(chat.id)" class="opacity-0 group-hover:opacity-100 text-zinc-500 transition-all p-1 trash-anim">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </template>
            </div>

            <div class="p-4 border-t border-white/5 bg-black/20 flex items-center gap-2">
                <!-- Theme Toggle Button -->
                <button @click="toggleTheme()" class="p-2.5 glass rounded-xl hover:bg-white/10 transition-all btn-icon-hover text-zinc-400 shrink-0 flex items-center justify-center">
                    <span x-show="theme === 'dark'"><i data-lucide="sun" class="w-4 h-4"></i></span>
                    <span x-show="theme === 'light'" x-cloak><i data-lucide="moon" class="w-4 h-4"></i></span>
                </button>

                <!-- Settings Button -->
                <button @click="isSettingsOpen = true" class="flex-1 py-2.5 px-4 rounded-xl hover:bg-white/10 transition-all flex items-center gap-3 text-sm text-zinc-300 font-medium btn-icon-hover group">
                    <i data-lucide="settings" class="w-4 h-4 text-zinc-400 transition-transform duration-500 group-hover:rotate-180"></i> Настройки
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-full relative bg-bgbase">
        
        <!-- Плавающая кнопка Меню -->
        <div class="absolute top-4 left-4 z-30" x-show="!isSidebarOpen" x-transition.opacity.duration.300ms x-cloak>
            <button @click="isSidebarOpen = true" class="p-2.5 glass rounded-xl text-zinc-300 hover:text-white border border-white/15 shadow-xl bg-black/50 backdrop-blur-md flex items-center gap-2 btn-icon-hover">
                <i data-lucide="menu" class="w-5 h-5"></i>
                <span class="text-xs font-medium pr-1 hidden sm:inline">Меню</span>
            </button>
        </div>

        <!-- Messages Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto overflow-x-hidden p-4 pt-20 md:p-8 md:pt-20 space-y-8 scroll-smooth relative z-0">
            <template x-if="currentChat?.messages.length === 0">
                <div class="flex flex-col items-center justify-center h-full text-zinc-500 animate-fade-in">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="w-20 h-20 mb-6 rounded-3xl shadow-2xl opacity-80 transform transition-transform hover:scale-105 duration-300">
                      <defs>
                        <linearGradient id="line-blue-ws" x1="0%" y1="0%" x2="100%" y2="100%">
                          <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.95"/>
                          <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.35"/>
                        </linearGradient>
                        <linearGradient id="line-white-ws" x1="100%" y1="0%" x2="0%" y2="100%">
                          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
                          <stop offset="100%" stop-color="#a1a1aa" stop-opacity="0.25"/>
                        </linearGradient>
                        <filter id="node-shadow-ws" x="-20%" y="-20%" width="140%" height="140%">
                          <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.95"/>
                        </filter>
                      </defs>
                      <rect width="512" height="512" rx="112" fill="#09090b"/>
                      <g filter="url(#node-shadow-ws)">
                        <circle cx="256" cy="256" r="175" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2.5" stroke-dasharray="10 10"/>
                        <path d="M 90 256 C 160 256, 175 150, 256 150" fill="none" stroke="url(#line-blue-ws)" stroke-width="11" stroke-linecap="round"/>
                        <path d="M 422 256 C 352 256, 337 362, 256 362" fill="none" stroke="url(#line-white-ws)" stroke-width="11" stroke-linecap="round"/>
                        <rect x="201" y="201" width="110" height="110" rx="32" transform="rotate(45 256 256)" fill="#18181b" stroke="#ffffff" stroke-width="4" stroke-opacity="0.85"/>
                        <circle cx="256" cy="256" r="22" fill="#3b82f6"/>
                        <circle cx="256" cy="256" r="9" fill="#ffffff"/>
                      </g>
                    </svg>
                    <h3 class="text-xl font-semibold text-zinc-300 mb-6">Добро пожаловать в ProxyChat</h3>
                    
                    <div class="flex flex-wrap justify-center gap-2 text-xs">
                        <span class="px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-zinc-400">@gpt для логики</span>
                        <span class="px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-zinc-400">@claude для кода</span>
                        <span class="px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-zinc-400">@gemini для скорости</span>
                    </div>
                </div>
            </template>

            <template x-for="(msg, index) in currentChat?.messages" :key="index">
                <div class="w-full flex flex-col items-center max-w-full min-w-0">
                    
                    <!-- Визуальный разделитель смены модели -->
                    <template x-if="index === 0 || (currentChat.messages[index-1] && currentChat.messages[index-1].model !== msg.model)">
                        <div class="w-full flex justify-center mb-6 mt-2 opacity-85 animate-fade-in">
                            <div class="glass px-4 py-1.5 rounded-full bg-black/40 border border-white/5 flex items-center gap-2 shadow-sm backdrop-blur-md">
                                <i data-lucide="cpu" class="w-3.5 h-3.5 text-zinc-400"></i>
                                <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest" x-text="'Модель: ' + (msg.model || 'gpt-5.6-terra')"></span>
                            </div>
                        </div>
                    </template>

                    <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'" class="w-full animate-fade-in min-w-0">
                        <div :class="msg.role === 'user' ? 'bg-blue-600/20 text-white border-blue-500/20' : 'glass text-gray-200'" class="max-w-full md:max-w-[85%] min-w-0 rounded-2xl px-5 py-4 shadow-md relative group border">
                            
                            <!-- Attached Image -->
                            <template x-if="msg.image">
                                <img :src="msg.image" class="max-w-[240px] md:max-w-sm rounded-xl mb-3 border border-white/10 shadow-xl object-contain bg-black/40">
                            </template>

                            <!-- Markdown Content with Dynamic Theme Class -->
                            <div class="prose max-w-none w-full min-w-0 overflow-x-auto text-[15px] md:text-base leading-relaxed break-words" :class="theme === 'dark' ? 'prose-invert' : 'prose-neutral'" :id="'msg-' + currentChat.id + '-' + index" x-html="renderMarkdown(msg.text)"></div>

                            <!-- Actions Hover -->
                            <div :class="msg.role === 'user' ? 'left-2' : 'right-2'" class="absolute -bottom-5 md:-bottom-4 opacity-0 group-hover:opacity-100 transition-all duration-200 transform translate-y-2 group-hover:translate-y-0">
                                <button @click="copyText(msg.text)" class="p-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white border border-white/10 shadow-lg btn-icon-hover">
                                    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
            <div class="h-4"></div>
        </div>

        <!-- Input Area -->
        <div class="w-full p-4 md:p-6 shrink-0 relative z-10 bg-bgbase">
            
            <div class="absolute bottom-full left-0 w-full h-12 bg-gradient-to-t from-bgbase to-transparent pointer-events-none"></div>
            
            <div class="max-w-4xl mx-auto relative">
                <!-- Mentions Popup -->
                <div x-show="mentionPopupOpen" x-cloak class="absolute bottom-full mb-3 left-0 w-64 glass rounded-xl overflow-hidden shadow-2xl z-50 border border-white/10 transform transition-all">
                    <div class="px-4 py-2.5 text-xs font-bold text-zinc-400 uppercase tracking-wider border-b border-white/10 bg-black/40">Выбор модели</div>
                    <template x-for="model in filteredModels" :key="model.id">
                        <div @click="selectMention(model)" class="px-4 py-3 hover:bg-white/10 cursor-pointer flex flex-col gap-1 border-b border-white/5 last:border-0 transition-colors">
                            <span class="text-sm font-semibold text-white" x-text="model.name"></span>
                            <span class="text-[11px] text-blue-400/80 font-medium" x-text="model.tags.join(', ')"></span>
                        </div>
                    </template>
                </div>

                <!-- Image Preview -->
                <div x-show="attachedImage" x-cloak class="absolute bottom-full mb-4 left-0 glass p-1.5 rounded-xl border border-white/10 shadow-xl">
                    <div class="relative group">
                        <img :src="attachedImage" class="h-24 w-auto rounded-lg object-cover">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity rounded-lg flex items-center justify-center backdrop-blur-sm">
                            <button @click="attachedImage = null" class="bg-red-500/90 text-white p-2 rounded-full shadow-lg hover:scale-110 transition-transform btn-icon-hover">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Main Input Box -->
                <div class="glass-input rounded-2xl flex items-end p-2 md:p-2.5 gap-2 transition-all relative">
                    
                    <div x-show="isStreaming" x-cloak class="absolute -top-6 left-4 flex items-center gap-2 text-xs font-medium text-zinc-400 bg-black/60 px-3 py-1 rounded-full border border-white/10 backdrop-blur-md shadow-lg">
                        <div class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_8px_rgba(74,222,128,0.5)] animate-pulse"></div>
                        <span>Генерация ответа...</span>
                    </div>

                    <label class="p-2.5 md:p-3 text-zinc-400 hover:text-white hover:bg-white/10 rounded-xl cursor-pointer transition-colors flex-shrink-0 btn-icon-hover">
                        <input type="file" accept="image/*" class="hidden" @change="handleImageUpload">
                        <i data-lucide="paperclip" class="w-5 h-5"></i>
                    </label>

                    <textarea 
                        x-ref="textarea"
                        x-model="input" 
                        @input="handleInput"
                        @keydown.enter.prevent="if(!$event.shiftKey) sendMessage()"
                        rows="1" 
                        class="w-full bg-transparent text-white placeholder-zinc-500 outline-none resize-none py-2.5 md:py-3 px-2 max-h-[40vh] overflow-y-auto text-[15px] md:text-base leading-relaxed" 
                        :placeholder="isMobile ? 'Сообщение...' : 'Сообщение... (начните с @ для модели)'">
                    </textarea>

                    <button 
                        @click="sendMessage()"
                        :disabled="isStreaming || (!input.trim() && !attachedImage)"
                        class="p-2.5 md:p-3 text-white bg-white/10 hover:bg-white/20 disabled:opacity-40 disabled:hover:bg-white/10 rounded-xl transition-all flex-shrink-0 shadow-sm border border-white/10 group btn-icon-hover"
                    >
                        <i data-lucide="send" class="w-5 h-5 transition-transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        const renderer = new marked.Renderer();
        renderer.code = function(codeBlock) {
            const text = typeof codeBlock === 'object' ? codeBlock.text : arguments[0];
            const lang = typeof codeBlock === 'object' ? codeBlock.lang : arguments[1];
            
            const language = hljs.getLanguage(lang) ? lang : 'plaintext';
            const safeText = encodeURIComponent(text);
            return `<div class="relative group my-5 rounded-xl overflow-hidden border border-white/10 shadow-lg">
                      <div class="flex items-center justify-between px-4 py-2 bg-zinc-900 border-b border-white/5">
                        <span class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider">${language}</span>
                        <button onclick="navigator.clipboard.writeText(decodeURIComponent('${safeText}'))" class="text-zinc-500 hover:text-white transition-colors p-1 flex items-center gap-1.5 bg-white/5 hover:bg-white/10 rounded-md btn-icon-hover">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                            <span class="text-[10px] font-medium hidden sm:inline">Копировать</span>
                        </button>
                      </div>
                      <div class="p-4 bg-[#0d0e12] overflow-x-auto text-sm leading-relaxed">
                        <pre style="background:transparent; margin:0; padding:0"><code class="language-${language}">${text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>
                      </div>
                    </div>`;
        };
        marked.use({ renderer });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
        }

        document.addEventListener('alpine:init', () => {
            Alpine.data('app', () => ({
                isSettingsOpen: false,
                isSidebarOpen: window.innerWidth >= 768,
                isMobile: window.innerWidth < 768,
                showKey: false,
                
                // Theme Logic
                theme: localStorage.getItem('proxy_theme') || 'dark',

                // Soft Load
                apiKey: localStorage.getItem('proxy_apiKey') || localStorage.getItem('apiKey') || '',
                customBaseUrl: localStorage.getItem('proxy_custom_base_url') || localStorage.getItem('prism_custom_base_url') || '',
                
                models: [
                    { id: 'gpt-5.6-terra', name: 'gpt-5.6-terra', tags: ['@gpt', '@terra'] },
                    { id: 'gemini-3.5-flash-lite', name: 'gemini-3.5-flash-lite', tags: ['@gemini', '@flash'] },
                    { id: 'claude-opus-5', name: 'claude-opus-5', tags: ['@claude', '@opus'] }
                ],
                
                currentModel: localStorage.getItem('proxy_currentModel') || localStorage.getItem('currentModel') || 'gpt-5.6-terra',
                chats: JSON.parse(localStorage.getItem('proxy_chats') || localStorage.getItem('chats') || '[]'),
                
                currentChatId: null,
                input: '',
                attachedImage: null,
                isStreaming: false,
                mentionPopupOpen: false,
                filteredModels: [],

                initApp() {
                    if (!this.apiKey) {
                        this.isSettingsOpen = true;
                    }
                    if (this.chats.length > 0) {
                        this.currentChatId = this.chats[0].id;
                    } else {
                        this.createNewChat();
                    }
                    
                    window.addEventListener('resize', () => {
                        this.isMobile = window.innerWidth < 768;
                        if (window.innerWidth >= 768 && !this.isSidebarOpen && this.chats.length > 0) {
                            // Опционально
                        }
                    });

                    this.safeRefreshUI();
                },

                toggleTheme() {
                    this.theme = this.theme === 'dark' ? 'light' : 'dark';
                    localStorage.setItem('proxy_theme', this.theme);
                },

                getEndpointForModel(modelId) {
                    const m = (modelId || '').toLowerCase().trim();
                    if (m.includes('claude') || m.includes('opus') || m.includes('sonnet') || m.includes('anthropic')) {
                        return 'https://api.proxyapi.ru/anthropic/v1/messages';
                    }
                    if (m.includes('gemini') || m.includes('flash') || m.includes('google')) {
                        return `https://api.proxyapi.ru/google/v1beta/models/${modelId}:streamGenerateContent?alt=sse`;
                    }
                    return 'https://api.proxyapi.ru/openai/v1/chat/completions';
                },

                safeRefreshUI() {
                    setTimeout(() => {
                        if (typeof lucide !== 'undefined') {
                            lucide.createIcons();
                        }
                        this.scrollToBottom();
                    }, 50);
                },

                get currentChat() {
                    return this.chats.find(c => c.id === this.currentChatId);
                },

                saveSettings() {
                    localStorage.setItem('proxy_apiKey', this.apiKey);
                    localStorage.setItem('proxy_custom_base_url', this.customBaseUrl);
                    localStorage.setItem('proxy_currentModel', this.currentModel);
                    this.isSettingsOpen = false;
                },

                saveData() {
                    localStorage.setItem('proxy_chats', JSON.stringify(this.chats));
                    localStorage.setItem('proxy_currentModel', this.currentModel);
                },

                createNewChat() {
                    const id = Date.now().toString();
                    this.chats.unshift({ id, title: '', messages: [] });
                    this.currentChatId = id;
                    this.saveData();
                    if(window.innerWidth < 768) this.isSidebarOpen = false;
                    this.safeRefreshUI();
                },

                switchChat(id) {
                    this.currentChatId = id;
                    if(window.innerWidth < 768) this.isSidebarOpen = false;
                    this.safeRefreshUI();
                },

                deleteChat(id) {
                    this.chats = this.chats.filter(c => c.id !== id);
                    if (this.currentChatId === id) {
                        this.currentChatId = this.chats.length ? this.chats[0].id : null;
                        if (!this.currentChatId) this.createNewChat();
                    }
                    this.saveData();
                    this.safeRefreshUI();
                },

                handleImageUpload(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => { this.attachedImage = e.target.result; };
                    reader.readAsDataURL(file);
                    e.target.value = '';
                },

                handleInput(e) {
                    const el = e.target;
                    el.style.height = 'auto';
                    el.style.height = (Math.min(el.scrollHeight, window.innerHeight * 0.4)) + 'px';
                    this.scrollToBottom();
                    
                    if (/^@([a-zA-Z0-9-\.]*)$/.test(this.input)) {
                        const query = this.input.substring(1).toLowerCase();
                        this.filteredModels = this.models.filter(m => 
                            m.tags.some(t => t.includes(query)) || m.name.toLowerCase().includes(query)
                        );
                        this.mentionPopupOpen = this.filteredModels.length > 0;
                    } else {
                        this.mentionPopupOpen = false;
                    }
                },

                selectMention(model) {
                    this.currentModel = model.id;
                    this.input = '@' + model.name + ' ';
                    this.mentionPopupOpen = false;
                    this.$refs.textarea.focus();
                    this.saveData();
                },

                async sendMessage() {
                    if (this.isStreaming || (!this.input.trim() && !this.attachedImage)) return;
                    if (!this.apiKey) return this.isSettingsOpen = true;

                    let textToSend = this.input.trim();
                    let activeModel = this.currentModel;
                    let visualBadge = null;

                    const mentionMatch = textToSend.match(/^@([a-zA-Z0-9-\.]+)/);
                    if (mentionMatch) {
                        const tag = mentionMatch[0].toLowerCase();
                        const matchedModel = this.models.find(m => 
                            m.tags.includes(tag) || 
                            ('@' + m.id.toLowerCase()) === tag || 
                            ('@' + m.name.toLowerCase()) === tag
                        );
                        if (matchedModel) {
                            activeModel = matchedModel.id;
                            visualBadge = matchedModel.name;
                            textToSend = textToSend.replace(mentionMatch[0], '').trim();
                        }
                    }

                    const userMsg = {
                        role: 'user',
                        text: textToSend,
                        image: this.attachedImage,
                        modelBadge: visualBadge,
                        model: activeModel 
                    };

                    this.currentChat.messages.push(userMsg);
                    
                    if (this.currentChat.messages.length === 1) {
                        this.currentChat.title = textToSend.substring(0, 30) || 'Новый диалог';
                    }

                    this.input = '';
                    this.attachedImage = null;
                    this.mentionPopupOpen = false;
                    this.$refs.textarea.style.height = 'auto';
                    this.saveData();
                    this.safeRefreshUI();

                    const apiMessages = this.currentChat.messages.filter(m => m.text !== undefined).map(msg => {
                        if (msg.role === 'user' && msg.image) {
                            return { role: msg.role, content: [{ type: "text", text: msg.text || ' ' }, { type: "image_url", image_url: { url: msg.image } }] };
                        }
                        return { role: msg.role, content: msg.text };
                    });

                    const googleContents = this.currentChat.messages.filter(m => m.text !== undefined).map(msg => {
                        let parts = [];
                        if (msg.role === 'user' && msg.image) {
                            const b64 = msg.image.split(',')[1];
                            const mime = msg.image.split(';')[0].split(':')[1];
                            parts.push({ inline_data: { mime_type: mime, data: b64 } });
                            parts.push({ text: msg.text || ' ' });
                        } else {
                            parts.push({ text: msg.text || '' });
                        }
                        return {
                            role: msg.role === 'assistant' ? 'model' : 'user',
                            parts: parts
                        };
                    });

                    const assistantIdx = this.currentChat.messages.length;
                    this.currentChat.messages.push({ role: 'assistant', text: '', model: activeModel });
                    this.isStreaming = true;

                    const customUrlStr = localStorage.getItem('proxy_custom_base_url') || localStorage.getItem('prism_custom_base_url');
                    const customUrl = customUrlStr && customUrlStr.trim() !== '' ? customUrlStr.trim().replace(/\/+$/, '') : null;
                    
                    let targetEndpoint = customUrl ? `${customUrl}/chat/completions` : this.getEndpointForModel(activeModel);
                    let requestBody = {};
                    const m = activeModel.toLowerCase().trim();

                    if (m.includes('claude') || m.includes('opus') || m.includes('sonnet') || m.includes('anthropic')) {
                        requestBody = {
                            model: activeModel,
                            messages: apiMessages,
                            max_tokens: 4096,
                            stream: true
                        };
                    } else if (m.includes('gemini') || m.includes('flash') || m.includes('google')) {
                        if (customUrl) {
                            requestBody = { model: activeModel, messages: apiMessages, stream: true };
                        } else {
                            requestBody = { contents: googleContents };
                        }
                    } else {
                        requestBody = {
                            model: activeModel,
                            messages: apiMessages,
                            stream: true
                        };
                    }

                    try {
                        const response = await fetch(targetEndpoint, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.apiKey}`
                            },
                            body: JSON.stringify(requestBody)
                        });

                        if (!response.ok) throw new Error(`API Error: ${response.status} ${response.statusText}`);

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder('utf-8');
                        let buffer = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            
                            buffer += decoder.decode(value, { stream: true });
                            let lines = buffer.split('\n');
                            buffer = lines.pop(); 

                            for (let line of lines) {
                                line = line.trim();
                                if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                                    try {
                                        const parsed = JSON.parse(line.slice(6));
                                        let chunk = '';

                                        if (parsed.choices && parsed.choices[0]?.delta?.content) {
                                            chunk = parsed.choices[0].delta.content;
                                        } else if (parsed.delta && parsed.delta.text) {
                                            chunk = parsed.delta.text;
                                        } else if (parsed.candidates && parsed.candidates[0]?.content?.parts?.[0]?.text) {
                                            chunk = parsed.candidates[0].content.parts[0].text;
                                        }

                                        if (chunk) {
                                            this.currentChat.messages[assistantIdx].text += chunk;
                                            this.scrollToBottom();
                                        }
                                    } catch (e) {}
                                }
                            }
                        }
                    } catch (error) {
                        this.currentChat.messages[assistantIdx].text = `**Ошибка:** ${error.message}. Эндпоинт: ${targetEndpoint}`;
                    } finally {
                        this.isStreaming = false;
                        this.saveData();
                        
                        setTimeout(() => {
                            if (typeof lucide !== 'undefined') lucide.createIcons();
                            this.applyMathAndHighlight(`msg-${this.currentChat.id}-${assistantIdx}`);
                            this.scrollToBottom();
                        }, 50);
                    }
                },

                renderMarkdown(text) {
                    return marked.parse(text || '');
                },

                applyMathAndHighlight(elementId) {
                    const el = document.getElementById(elementId);
                    if (!el) return;
                    
                    if (typeof renderMathInElement !== 'undefined') {
                        renderMathInElement(el, {
                            delimiters: [
                                {left: '$$', right: '$$', display: true},
                                {left: '\\[', right: '\\]', display: true},
                                {left: '$', right: '$', display: false},
                                {left: '\\(', right: '\\)', display: false}
                            ],
                            throwOnError: false
                        });
                    }

                    if (typeof hljs !== 'undefined') {
                        el.querySelectorAll('pre code').forEach((block) => {
                            hljs.highlightElement(block);
                        });
                    }
                },

                scrollToBottom() {
                    const container = document.getElementById('chat-container');
                    if(container) container.scrollTop = container.scrollHeight;
                },

                copyText(text) {
                    navigator.clipboard.writeText(text);
                }
            }));
        });
    </script>
</body>
</html>
